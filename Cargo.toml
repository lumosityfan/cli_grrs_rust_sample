[package]
name = "cli_grrs_rust_sample"
version = "0.1.0"
authors = ["Jeff Xie <jeffxie4@gmail.com>"]
license = "MIT"
description = "A tool to search files"
readme = "README.md"
homepage = "https://github.com/lumosityfan/cli_grrs_rust_sample"
repository = "https://github.com/lumosityfan/cli_grrs_rust_sample"
keywords = ["cli", "search", "demo"]
categories = ["command-line-utilities"]
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
assert_fs = "1.1.1"